# Phase 2: backend + persistent SQLite volume. The frontend and Caddy (TLS
# reverse proxy) are added in Phase 7 — see docs/ROADMAP.md.
services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DB_PATH: /data/panel.db
      PANEL_HTTP_ADDR: ":8080"
    volumes:
      - panel-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  panel-data:
